openapi: 3.0.3
info:
  title: GRIND API v1
  version: 1.0.0
  description: |
    Zero-knowledge sync API for the GRIND app. The server stores ciphertext, wrapped keys and sizes only. It never sees
    health or location values, record types or names; all of that lives inside the ciphertext.

    Contract first: this file is the source of truth. The backend's Java interfaces and the app's TypeScript types are
    generated from it; change it here first.

    Every /grind/api/v1 call needs a Supabase access token (Bearer JWT) and arrives through the Cloudflare edge.
    Errors are RFC 9457 problem details whose `type` is `urn:grind:problem:<code>`; they never contain user data.

    Required on every /grind/api/v1 request (checked by the server before routing, so not repeated per operation):
    - `X-Grind-Client: <ios|android|web>/<major>.<minor>.<patch>`, the app build. A missing or malformed value gets
      400 `client_header`. A build older than the minimum supported for its platform gets 426 `upgrade_required`.
    - `X-Correlation-Id` (optional): 8-64 characters from `[A-Za-z0-9-]`. Generated by the server when absent. It is
      returned on every response, written on every log line and carried through Pub/Sub to the worker, so one user
      action can be followed from the app to the database.

    Versioning: the version is part of the path (`/grind/api/v1`). A new major version gets its own contract file
    (`openapi/v2/grind-api-v2.yaml`) served under `/grind/api/v2`, side by side with v1. A version being retired answers
    with `Deprecation` (RFC 9745) and `Sunset` (RFC 8594) headers before it is removed.
servers:
  - url: https://api.example.invalid
    description: Placeholder until OD-4 (domain) is decided.
security:
  - supabaseJwt: []
tags:
  - name: account
  - name: uploads
  - name: records
  - name: keyring
  - name: connections
paths:
  /grind/api/v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: Who the access token belongs to.
      responses:
        '200':
          description: The token's subject.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /grind/api/v1/account:
    delete:
      tags: [account]
      operationId: deleteAccount
      summary: Delete the account, every record, every blob and the sign-in user.
      description: |
        Records the request at once (later writes get 410) and finishes in the background: blobs, rows, then the
        Supabase user. Safe to call again; an interrupted deletion resumes.
      responses:
        '202': { description: Deletion accepted. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /grind/api/v1/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: A short-lived URL to upload one encrypted blob straight to storage.
      description: |
        Ask for the URL just before uploading. The size and SHA-256 are signed into the URL, so storage
        rejects any other body. Send exactly the returned headers with the PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '200':
          description: Upload ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { $ref: '#/components/responses/AccountDeleted' }

  /grind/api/v1/records:
    get:
      tags: [records]
      operationId: listRecords
      summary: Records changed after a cursor (sync down).
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor from the previous page; omit for the first sync.
          schema: { type: string, maxLength: 32, pattern: '^[0-9]+$' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: One page of changes, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /grind/api/v1/records/{id}:
    put:
      tags: [records]
      operationId: putRecord
      summary: Store a new revision of one encrypted record (sync up).
      description: |
        Idempotent by (id, rev): a retry of the same revision is accepted again. Accepted after the event is queued;
        the record appears in `listRecords` once the worker has written it.

        Storage quota: a revision that would take the account over its quota gets 403 `quota_exceeded`. Revisions
        submitted at the same moment are checked again when stored; one that no longer fits is dropped, so the app
        re-submits any revision it doesn't see in `listRecords` and then gets the 403. Shrinking or deleting a record
        is always accepted.
      parameters:
        - { $ref: '#/components/parameters/RecordId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordWrite' }
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/AccountDeleted' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /grind/api/v1/records/{id}/blob:
    get:
      tags: [records]
      operationId: getRecordBlob
      summary: A short-lived URL to download a record's encrypted blob.
      parameters:
        - { $ref: '#/components/parameters/RecordId' }
      responses:
        '200':
          description: Download ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /grind/api/v1/keyring:
    get:
      tags: [keyring]
      operationId: getKeyring
      summary: The wrapped master key (passphrase and recovery wraps).
      responses:
        '200':
          description: Keyring.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Keyring' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [keyring]
      operationId: putKeyring
      summary: Create or replace the keyring, only if nobody changed it meanwhile.
      description: Compare-and-swap on `rev`. Send `expectedRev` 0 to create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyringWrite' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Keyring' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/AccountDeleted' }

  /grind/api/v1/connections/{provider}/token:
    post:
      tags: [connections]
      operationId: exchangeConnectionToken
      summary: Get a partner's OAuth tokens for the signed-in user (token broker, served by grind-partner).
      description: |
        The app runs the provider's OAuth flow itself (its own `state` check, PKCE where the provider supports it) and
        sends the result here, because the token request needs GRIND's client secret, which never ships in the app.
        The server forwards the request to the provider and returns the provider's tokens. It **stores nothing**,
        never calls the provider's data endpoints and never logs tokens: the app keeps the tokens (encrypted, synced to
        the user's other devices as ciphertext) and fetches the data itself.

        Refresh tokens are single-use at both providers: when a refresh is rejected, the app pulls the newest synced
        token and retries once before asking the user to connect again.
      parameters:
        - name: provider
          in: path
          required: true
          description: Partner id, e.g. `oura`, `whoop`. Only partners configured on the server are available.
          schema: { type: string, minLength: 2, maxLength: 32, pattern: '^[a-z][a-z0-9-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectionTokenRequest' }
      responses:
        '200':
          description: The provider's tokens. Sent with `Cache-Control no-store`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: This provider isn't set up on this server (`connection_not_configured`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410': { $ref: '#/components/responses/AccountDeleted' }
        '422':
          description: The provider rejected the code or refresh token (`connection_rejected`); connect again.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: The provider didn't answer in time (`provider_unavailable`); retry later.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      description: Record id chosen by the phone (UUID).
      schema: { type: string, format: uuid }

  schemas:
    Me:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }

    Base64Sha256:
      type: string
      description: SHA-256 of the encrypted bytes, standard base64 (44 characters).
      pattern: '^[A-Za-z0-9+/]{43}=$'

    UploadRequest:
      type: object
      required: [size, sha256]
      properties:
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 8388608
          description: Exact byte size of the encrypted blob (max 8 MiB).
        sha256: { $ref: '#/components/schemas/Base64Sha256' }

    UploadTicket:
      type: object
      required: [blobKey, uploadUrl, headers, expiresAt]
      properties:
        blobKey: { type: string, maxLength: 128 }
        uploadUrl: { type: string, format: uri }
        headers:
          type: object
          description: Headers that must be sent unchanged with the PUT (they are part of the signature).
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }

    DownloadTicket:
      type: object
      required: [downloadUrl, expiresAt]
      properties:
        downloadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    BlobRef:
      type: object
      required: [key, size, sha256]
      properties:
        key: { type: string, maxLength: 128 }
        size: { type: integer, format: int64, minimum: 1, maximum: 8388608 }
        sha256: { $ref: '#/components/schemas/Base64Sha256' }

    RecordWrite:
      type: object
      description: |
        One revision. A deletion carries no content. Otherwise exactly one of `inline` (small records) or `blob`
        (large ones, uploaded first), plus the wrapped data key.
      required: [rev, deleted]
      properties:
        rev: { type: integer, format: int64, minimum: 1 }
        deleted: { type: boolean }
        inline:
          type: string
          format: byte
          maxLength: 5464
          description: AES-256-GCM ciphertext, base64, at most 4 KiB decoded. Larger records go to `blob`.
        blob: { $ref: '#/components/schemas/BlobRef' }
        wrappedDek:
          type: string
          maxLength: 256
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
          description: The record's data key wrapped with the user's key (AES-KW), base64.

    RecordAccepted:
      type: object
      required: [id, rev]
      properties:
        id: { type: string, format: uuid }
        rev: { type: integer, format: int64 }

    RecordEnvelope:
      type: object
      required: [id, rev, deleted, updatedAt]
      properties:
        id: { type: string, format: uuid }
        rev: { type: integer, format: int64 }
        deleted: { type: boolean }
        updatedAt: { type: string, format: date-time }
        inline: { type: string, format: byte }
        blob: { $ref: '#/components/schemas/BlobRef' }
        wrappedDek: { type: string }

    RecordPage:
      type: object
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RecordEnvelope' }
        nextCursor: { type: string }
        hasMore: { type: boolean }

    KeyringBody:
      type: object
      required: [version, salt, iterations, wrappedByPassphrase, wrappedByRecovery, check]
      properties:
        version: { type: integer, minimum: 1, maximum: 100 }
        salt: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9+/]+={0,2}$' }
        iterations: { type: integer, minimum: 400000, maximum: 2000000 }
        wrappedByPassphrase: { type: string, maxLength: 512, pattern: '^[A-Za-z0-9+/]+={0,2}$' }
        wrappedByRecovery: { type: string, maxLength: 512, pattern: '^[A-Za-z0-9+/]+={0,2}$' }
        check: { type: string, maxLength: 256, pattern: '^[A-Za-z0-9+/]+={0,2}$' }

    Keyring:
      allOf:
        - $ref: '#/components/schemas/KeyringBody'
        - type: object
          required: [rev]
          properties:
            rev: { type: integer, format: int64, minimum: 1 }

    KeyringWrite:
      allOf:
        - $ref: '#/components/schemas/KeyringBody'
        - type: object
          required: [expectedRev]
          properties:
            expectedRev: { type: integer, format: int64, minimum: 0 }

    ConnectionTokenRequest:
      type: object
      description: |
        `authorization_code`: send `code` and `redirectUri` (must be one GRIND registered), plus `codeVerifier` when
        the app used PKCE. `refresh_token`: send `refreshToken`.
      required: [grantType]
      properties:
        grantType:
          type: string
          enum: [authorization_code, refresh_token]
        code: { type: string, minLength: 1, maxLength: 2048 }
        redirectUri: { type: string, minLength: 1, maxLength: 512 }
        codeVerifier: { type: string, minLength: 43, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$' }
        refreshToken: { type: string, minLength: 1, maxLength: 4096 }

    ConnectionTokens:
      type: object
      required: [accessToken, expiresIn, tokenType]
      properties:
        accessToken: { type: string }
        refreshToken:
          type: string
          description: A new refresh token; the one sent (if any) no longer works.
        expiresIn: { type: integer, format: int64, description: Seconds until the access token expires. }
        tokenType: { type: string }
        scope: { type: string }

    Problem:
      type: object
      description: RFC 9457 problem details. Never contains user data.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

  responses:
    BadRequest:
      description: The request doesn't match the contract.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, expired or invalid token (no body; see the WWW-Authenticate header).
    Forbidden:
      description: Not allowed (another user's blob, storage quota reached, or the request bypassed the edge).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Nothing there.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: A newer revision is already stored. Pull changes first.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AccountDeleted:
      description: The account is being deleted; nothing more is accepted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: The referenced blob is missing or doesn't match its size.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
